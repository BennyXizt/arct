name: Configure Repository Once

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest

    steps:
      - name: Create DEPLOY_ENABLED
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh variable set DEPLOY_ENABLED \
            --repo "${{ github.repository }}" \
            --body "false"
name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-pages:
    runs-on: ubuntu-latest

    outputs:
      enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Check Pages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "Pages is enabled"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pages is not enabled. Skipping deployment."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-pages
    if: needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs:
      - check-pages
      - build

    if: |
      needs.check-pages.outputs.enabled == 'true' &&
      needs.build.result == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  update-readme:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Update Live Demo URL
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          OWNER="${REPOSITORY%%/*}"
          REPO="${REPOSITORY#*/}"

          URL="https://${OWNER}.github.io/${REPO}/"

          sed -i -E \
            "s|(\[Open Website\]\()[^)]*(\))|\1${URL}\2|" \
            README.md

      - name: Commit README
        run: |
          if git diff --quiet README.md; then
            echo "README is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: update live demo URL"
          git push